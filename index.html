<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>counter</title>
    <!-- boot strap -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<!-- custom styling -->
     <link rel="stylesheet" href="./style.css">
</head>
<body>

<video autoplay muted loop id="bg-video">
    <source src="EID UL ADHA MUBARAK - Greeting Animation.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
</video>

</div>
<button id="audio-btn" onclick="toggleAudio()">🔊 Play Music</button>

<div class="content d-flex align-items-center justify-content-center min-vh-100">
    <div class="counter-container text-center px-4 py-5" id="main-box">
        
        <h1 id="status-heading" class="mb-4 fw-bold text-uppercase tracking-wide">Eid Holidays Ending Soon</h1>
        
        <div class="d-flex justify-content-center align-items-center gap-3" id="timer-box">
            <div class="time-card">
                <span id="hours" class="time-val">00</span>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-card">
                <span id="minutes" class="time-val">00</span>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-card">
                <span id="seconds" class="time-val">00</span>
                <div class="time-label">Seconds</div>
            </div>
            <div class="time-card marker-card">
                <span id="ampm" class="time-val">--</span>
                <div class="time-label">Marker</div>
            </div>
        </div>

    </div>
</div>







<!-- boot strap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <!-- custom js -->
    <script src="./app.js"></script>
</body>
